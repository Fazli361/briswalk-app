<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 580" fill="none" className="w-full h-full">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800;900&amp;display=swap');
      .txt-red { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; font-weight: 900; fill: #d60000; text-anchor: middle; }
      .txt-blue-bold { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; font-weight: 800; fill: #1e358b; }
      .txt-blue-sub { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; font-weight: 700; fill: #1e358b; letter-spacing: 0.04em; }
    </style>
  </defs>

  <!-- Blue Outer Swoop Loop -->
  <path d="M 175 520 C 120 440 60 360 25 240 C -8 135 45 35 155 8 C 170 4 185 2 195 0 C 160 30 115 105 110 180 C 105 270 170 380 230 450 C 265 490 280 515 285 540 C 265 545 220 540 175 520 Z" fill="#1e358b" />

  <!-- Blue Swoop Left Bottom Pinpoint -->
  <path d="M 195 0 C 130 15 50 80 18 180 C -12 280 28 395 105 480 L 195 565 C 165 500 115 420 85 320 C 58 230 85 140 150 70 C 170 48 190 30 205 18 Z" fill="#1e358b" />

  <!-- Red Middle Swoop Curve -->
  <path d="M 175 18 C 110 65 75 145 75 225 C 75 315 140 385 225 385 C 275 385 320 360 345 340 C 290 370 215 370 160 330 C 115 295 95 240 100 185 C 108 125 145 65 195 25 Z" fill="#d60000" />
  <path d="M 175 18 C 210 5 245 0 270 0 C 220 15 160 65 130 120 C 95 180 90 260 135 325 C 170 375 240 395 310 375 C 340 365 365 345 380 325 C 330 365 240 375 175 330 C 120 290 105 210 125 140 C 140 90 175 45 215 15 Z" fill="#d60000" />

  <!-- Yellow Right Crescent Swoop -->
  <path d="M 185 18 C 240 5 320 15 380 70 C 445 130 460 220 440 300 C 425 350 380 410 345 425 C 410 390 455 315 450 230 C 445 140 390 60 310 20 C 270 0 225 2 185 18 Z" fill="#ffde00" />

  <!-- Center Red Motto Text: PEMANGKIN MASYARAKAT SIHAT -->
  <g transform="translate(255, 160)">
    <text x="0" y="0" class="txt-red" font-size="28" letter-spacing="0.06em">PEMANGKIN</text>
    <text x="0" y="38" class="txt-red" font-size="25" letter-spacing="0.04em">MASYARAKAT</text>
    <text x="0" y="76" class="txt-red" font-size="28" letter-spacing="0.08em">SIHAT</text>
  </g>

  <!-- Lower Section: "Panel Penasihat KLINIK KESIHATAN CHANGKAT JERING" -->
  <g transform="translate(145, 410)">
    <!-- Lowercase anel (after the blue P stem) -->
    <text x="0" y="38" class="txt-blue-bold" font-size="52" letter-spacing="-0.02em">anel</text>
    <text x="18" y="90" class="txt-blue-bold" font-size="52" letter-spacing="-0.02em">enasihat</text>
    <text x="42" y="130" class="txt-blue-sub" font-size="22">KLINIK KESIHATAN</text>
    <text x="36" y="160" class="txt-blue-sub" font-size="22">CHANGKAT JERING</text>
  </g>
</svg>
